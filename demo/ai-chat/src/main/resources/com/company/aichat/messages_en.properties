com.company.aichat.view.chat/helpPanel.close=Close
com.company.aichat.view.chat/helpPanel.intro=The answers come from a **placeholder model**: no AI provider is needed, it picks a prepared reply by keywords in your message. The keywords are shown above the input and match at the start of a word, so `summary` also matches "summarize".
com.company.aichat.view.chat/tryIt.text=Try it
com.company.aichat.view.chat/tryErrorButton.text=Try error
com.company.aichat.view.chat/tryFailButton.text=Try fail
com.company.aichat.view.chat/helpStreaming.title=Streaming and Markdown
com.company.aichat.view.chat/helpStreaming.text=Answers stream token by token and render as Markdown: headings, lists, tables, quotes. Mention `summary` to get a project summary with a table.
com.company.aichat.view.chat/helpThinking.title=Thinking steps
com.company.aichat.view.chat/helpThinking.text=Before the first token, the chat shows a live feed of what the assistant is doing. The steps overlap, finish out of order and report progress. The view publishes them from a background thread through `ThinkingStatusPublisher`.
com.company.aichat.view.chat/helpCode.title=Code blocks
com.company.aichat.view.chat/helpCode.text=Mention `code` to get Java and SQL code blocks with syntax highlighting and a copy button.
com.company.aichat.view.chat/helpStop.title=Stop a generation
com.company.aichat.view.chat/helpStop.text=Mention `email` to get a long email that streams slowly. Press **Stop** in the input while it streams: the partial answer stays on screen, but it isn't saved, so it can't be rated.
com.company.aichat.view.chat/helpLong.title=Long answers
com.company.aichat.view.chat/helpLong.text=Mention `long` to get a long article, handy for building a conversation you can scroll through.
com.company.aichat.view.chat/helpErrors.title=Errors and retry
com.company.aichat.view.chat/helpErrors.text=Mention `error` to get an answer that breaks off midway, or `fail` to fail before the first word. The chat shows an error banner with **Retry**, and the view logs the failure from `GenerationFailedEvent`.
com.company.aichat.view.chat/helpAttachments.title=Attachments
com.company.aichat.view.chat/helpAttachments.text=Attach up to 3 files (images, text or PDF, 5 MB each) from the **+** menu, or drop them onto the chat. The model lists the files it received. The files are saved to the file storage with the message: click a file in the conversation to download it. A file that is too big or of another type is rejected with a notification.
com.company.aichat.view.chat/helpActions.title=Message actions
com.company.aichat.view.chat/helpActions.text=Each message has its own actions: **copy** for your messages and **copy**, **regenerate** and thumbs up or down for the answers. A rating asks for an optional comment and is saved with the answer.
com.company.aichat.view.chat/helpHistory.title=Saved history
com.company.aichat.view.chat/helpHistory.text=The chat is bound to a data container with `autoSave`, so every message is saved to the database and the conversation survives a page reload. Clear it from the **+** menu.
